spring.application.name=recruiter-bot
server.port=8080

# --- MySQL (credentials come from environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recruiter_bot_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Narasimha@12JW}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Run hand-written DDL (schema.sql) at startup; it uses CREATE TABLE IF NOT EXISTS so it is repeatable ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8

spring.jackson.default-property-inclusion=non_null
